services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trustvault
      POSTGRES_USER: trustvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustvault -d trustvault"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Database=trustvault;Username=trustvault;Password=${DB_PASSWORD}
      Storage__Root: /data/storage
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD in .env}
      # Demo only: lets the login cookie work on plain http://localhost. Leave unset behind real HTTPS.
      Security__AllowHttpCookies: "true"
    command: ["--migrate", "--seed"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - filestore:/data/storage

volumes:
  dbdata:
  filestore: